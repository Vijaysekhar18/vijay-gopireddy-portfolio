name: NYC visual and routing smoke
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'three-city.js'
      - 'city-life.js'
      - 'nyc-landmarks.js'
      - 'district-room.js'
      - 'index.html'
      - 'styles.css'
      - 'district-room.css'
      - 'tests/**'
      - 'portfolio-guide.js'
      - 'portfolio-guide.css'
      - 'work.html'
      - 'work-room.js'
      - 'work-room.css'
      - 'district.html'
      - 'subway-nav.js'
      - '.github/workflows/nyc-visual-smoke.yml'
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/nyc-server.log 2>&1 &
          sleep 2
      - name: Browser smoke tests and screenshots
        run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyc-screenshots
          path: test-screenshots/
